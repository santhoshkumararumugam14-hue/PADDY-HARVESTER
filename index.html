<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:#052e16;overflow-x:hidden;}
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght=700;800&family=Nunito:wght=400;600;700;800&display=swap');

/* Scrollbar */
::-webkit-scrollbar{width:5px;background:transparent;}
::-webkit-scrollbar-thumb{background:#16a34a44;border-radius:99px;}
input::placeholder,textarea::placeholder{color:#4ade8044;}
select option{background:#14532d;color:#f0fdf4;}

/* Animations */
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translate(-50%,20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* Layout */
#app{display:flex;min-height:100vh;position:relative;z-index:2;}

/* Sidebar */
#sidebar{width:72px;min-height:100vh;background:rgba(5,46,22,0.92);border-right:1px solid rgba(74,222,128,0.12);display:flex;flex-direction:column;align-items:center;padding:20px 0 24px;box-shadow:4px 0 32px rgba(0,0,0,0.4);position:fixed;top:0;left:0;bottom:0;z-index:10;}
.logo-btn{background:linear-gradient(135deg,#16a34a,#84cc16);border-radius:14px;padding:9px;margin-bottom:28px;cursor:pointer;border:none;box-shadow:0 4px 16px rgba(22,163,74,0.4);}
nav{flex:1;display:flex;flex-direction:column;gap:4px;align-items:center;width:100%;padding:0 8px;}
.nav-btn{width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;border:3px solid transparent;cursor:pointer;background:transparent;color:rgba(134,239,172,0.55);transition:all 0.2s;padding:0;font-family:'Nunito',sans-serif;}
.nav-btn:hover{background:rgba(74,222,128,0.1);}
.nav-btn.active{color:#4ade80;border-left-color:#4ade80;background:rgba(74,222,128,0.15);}
.nav-btn.active-bill{color:#4ade80;border-left-color:#4ade80;background:rgba(74,222,128,0.15);}
.nav-btn.active-exp{color:#a78bfa;border-left-color:#a78bfa;background:rgba(167,139,250,0.15);}
.nav-btn.active-cust{color:#fbbf24;border-left-color:#fbbf24;background:rgba(251,191,36,0.15);}
.nav-btn.active-rep{color:#38bdf8;border-left-color:#38bdf8;background:rgba(56,189,248,0.15);}
.nav-icon{font-size:20px;}
.nav-label{font-size:8px;font-weight:700;letter-spacing:0.5px;opacity:0.8;}
.clock{text-align:center;padding:12px 0 0;}
.clock-time{color:#4ade80;font-family:'Playfair Display',serif;font-size:12px;font-weight:700;letter-spacing:1px;}
.clock-date{color:rgba(74,222,128,0.4);font-size:9px;margin-top:2px;}

/* Main */
#main{margin-left:72px;flex:1;padding:32px 36px;overflow-y:auto;min-height:100vh;}

/* Panel */
#panel-backdrop{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,0.5);backdrop-filter:blur(3px);display:none;}
#panel{position:fixed;top:0;right:0;bottom:0;z-index:9;width:390px;max-width:92vw;background:rgba(3,36,15,0.98);border-left:1px solid rgba(74,222,128,0.25);box-shadow:-8px 0 48px rgba(0,0,0,0.7);overflow-y:auto;padding:28px 24px 40px;display:none;animation:slideIn 0.3s cubic-bezier(0.22,1,0.36,1);}
.panel-close{position:absolute;top:18px;right:18px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#86efac;font-size:16px;font-weight:700;}

/* Toast */
#toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:99999;border-radius:14px;padding:14px 28px;font-weight:800;font-size:15px;font-family:'Nunito',sans-serif;box-shadow:0 8px 32px rgba(0,0,0,0.5);animation:slideUp 0.3s ease;white-space:nowrap;display:none;}

/* Confirm */
#confirm-overlay{position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;}
#confirm-box{background:rgba(5,46,22,0.98);border:1px solid rgba(248,113,113,0.4);border-radius:20px;padding:32px 36px;max-width:340px;width:90%;text-align:center;}

/* Forms */
.field{display:flex;flex-direction:column;margin-bottom:14px;}
label{color:#86efac;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:4px;text-transform:uppercase;}
input,select,textarea{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);border-radius:10px;padding:10px 14px;color:#f0fdf4;font-size:14px;font-family:'Nunito',sans-serif;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:rgba(74,222,128,0.5);}
textarea{resize:none;height:54px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Autocomplete */
.ac-wrap{position:relative;}
.ac-drop{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:9999;background:rgba(5,46,22,0.98);border:1px solid rgba(74,222,128,0.35);border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.6);display:none;}
.ac-item{padding:11px 16px;color:#d1fae5;font-size:14px;cursor:pointer;border-bottom:1px solid rgba(74,222,128,0.07);font-family:'Nunito',sans-serif;font-weight:600;}
.ac-item:last-child{border-bottom:none;}
.ac-item:hover{background:rgba(74,222,128,0.13);}

/* Buttons */
.btn-green{background:linear-gradient(90deg,#16a34a,#84cc16);border:none;border-radius:12px;padding:13px;color:#052e16;font-weight:800;font-size:15px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 20px rgba(22,163,74,0.3);width:100%;}
.btn-purple{background:linear-gradient(90deg,#7c3aed,#a78bfa);border:none;border-radius:12px;padding:13px;color:white;font-weight:800;font-size:15px;cursor:pointer;font-family:'Nunito',sans-serif;width:100%;}
.btn-amber{background:linear-gradient(90deg,#d97706,#fbbf24);border:none;border-radius:12px;padding:13px;color:#1c1917;font-weight:800;font-size:15px;cursor:pointer;font-family:'Nunito',sans-serif;width:100%;}
.btn-outline{background:rgba(255,255,255,0.07);border:none;border-radius:99px;padding:7px 20px;cursor:pointer;color:#86efac;font-weight:700;font-size:13px;font-family:'Nunito',sans-serif;}
.btn-outline.active{background:linear-gradient(90deg,#16a34a,#84cc16);color:#052e16;}
.btn-del{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);border-radius:8px;color:#f87171;padding:5px 10px;cursor:pointer;font-size:13px;font-weight:700;}
.btn-del:hover{background:rgba(248,113,113,0.22);}
.btn-add{border:none;border-radius:12px;padding:12px 26px;font-weight:800;font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif;}

/* Stat cards */
.stat-grid{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:36px;}
.stat-card{background:rgba(255,255,255,0.08);backdrop-filter:blur(16px);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:5px;min-width:160px;}
.stat-icon{font-size:28px;}
.stat-label{color:#d1fae5;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.stat-value{font-size:24px;font-weight:800;font-family:'Playfair Display',serif;}
.stat-sub{color:#86efac;font-size:11px;}

/* Tables */
.table-wrap{background:rgba(255,255,255,0.03);border-radius:16px;overflow:auto;border:1px solid rgba(74,222,128,0.08);margin-top:8px;}
table{width:100%;border-collapse:collapse;min-width:600px;}
thead tr{background:rgba(22,163,74,0.07);}
th{padding:11px 12px;font-size:11px;font-weight:800;letter-spacing:1px;text-align:left;text-transform:uppercase;color:#4ade80;}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.035);font-size:13px;color:#f0fdf4;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,0.02);}
.badge{border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;}

/* Customer cards */
.cust-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;}
.cust-card{background:rgba(255,255,255,0.06);border:1px solid rgba(251,191,36,0.15);border-radius:18px;padding:20px;position:relative;transition:transform 0.2s;}
.cust-card:hover{transform:translateY(-2px);}
.cust-avatar{background:linear-gradient(135deg,#d97706,#fbbf24);border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
.mini-cell{background:rgba(0,0,0,0.2);border-radius:10px;padding:8px 12px;}
.mini-label{color:#9ca3af;font-size:10px;letter-spacing:1px;text-transform:uppercase;}
.mini-value{font-weight:800;font-size:16px;font-family:'Playfair Display',serif;}

/* Quick summary computed */
.calc-box{background:rgba(0,0,0,0.25);border-radius:14px;padding:14px 18px;display:flex;gap:20px;flex-wrap:wrap;border:1px solid rgba(74,222,128,0.1);margin-bottom:14px;}
.calc-item .ci-label{color:#9ca3af;font-size:10px;letter-spacing:1px;}
.calc-item .ci-val{font-weight:800;font-size:18px;font-family:'Playfair Display',serif;}

/* Nav card grid (dashboard) */
.nav-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:32px;}
.nav-card{background:rgba(255,255,255,0.05);border-radius:18px;padding:20px 22px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:16px;transition:all 0.2s;border:1px solid rgba(255,255,255,0.06);}
.nav-card:hover{background:rgba(255,255,255,0.09);transform:translateY(-2px);}
.nav-card-emoji{font-size:30px;}
.nav-card-title{font-weight:800;font-size:15px;}
.nav-card-sub{font-size:12px;margin-top:2px;color:rgba(134,239,172,0.35);}
.nc-arrow{margin-left:auto;opacity:0.35;font-size:18px;color:#fff;}

/* Page headers */
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
h1.ph{font-family:'Playfair Display',serif;font-size:32px;margin-bottom:4px;}
p.ph-sub{font-size:14px;}

/* Panel customer list */
.pcust-list{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow-y:auto;margin-top:12px;}
.pcust-row{background:rgba(251,191,36,0.07);border:1px solid rgba(251,191,36,0.18);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.pcust-avatar{background:linear-gradient(135deg,#d97706,#fbbf24);border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}

/* Report summary cards */
.rep-cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:32px;}
.rep-card{background:rgba(255,255,255,0.06);border-radius:16px;padding:18px 22px;min-width:148px;}
.rep-label{color:#9ca3af;font-size:12px;margin-bottom:4px;}
.rep-value{font-weight:800;font-size:22px;font-family:'Playfair Display',serif;}

/* Expenditure totals */
.exp-totals{background:rgba(167,139,250,0.07);border:1px solid rgba(167,139,250,0.18);border-radius:14px;padding:14px 22px;margin-bottom:18px;display:inline-flex;gap:28px;}
</style>
</head>
